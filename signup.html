<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" sizes="16x16" href="./imgs/icons8-test-tube-48.png" />
    <link rel="icon" sizes="32x32" href="./imgs/icons8-test-tube-48.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate">

  <title>Sign Up - AuthentiScan</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <!-- Header -->
  <header>
    <div class="sidebar" id="sidebar">
        <div class="logo">
            <img src="./imgs/icons8-test-tube-48.png" alt="Plagiarism Test Software Logo">
            <span>AuthentiScan</span>
        </div>
        
    </div>
  </header>
  <br>
  <div id="google_translate_element"></div>

<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement(
            {pageLanguage: 'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 
            'google_translate_element'
        );
    }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>


  <!-- Auth Section -->
  <section class="auth-section">
    <div class="auth-container">
      <div class="auth-card">
        <h2>Sign Up</h2>
        <form action="#" method="post">
          <div class="input-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required />
          </div>
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required />
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required />
          </div>
          <button type="submit" class="btn">Sign Up</button>
          <p class="auth-switch">
            Already have an account? <a href="login.html">Login</a>
          </p>
        </form>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container">
     <center> <p>&copy; 2025 AuthentiScan. All Rights Reserved.</p> </center>
    </div>
  </footer>
</body>
</html>
